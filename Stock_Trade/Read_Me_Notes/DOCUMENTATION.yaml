meta:
  name: Stock Trade Strategy (Stock_Trade)
  version: Prod Code v01
  platform: Zerodha Kite Connect
  strategy: Unified ABC Bullish Reversal Pattern (Stock & Daily Scan)
  deploy_type: Automated daily stock scanning & stock trade system
  coverage: [Nifty 50 constituent stocks]

architecture:
  diagram: "Browser(localhost:5051) -> app.py(Flask) -> {bull_nifty50_daily_scanner_export.py (Daily Scan)} -> input/ & output/ files"
  directory:
    root_files:
      app.py: "Flask dashboard (Stock Trade Control Center) on port 5051"
      trading_core.py: "Shared strategy core: pattern scanners, STOCK_REGISTRY, SUPER_STOCKS, find_profit_targets, session loading, market hours, journal writer"
      bull_nifty50_daily_scanner_export.py: "Nifty 50 daily scanner (Excel export)"
      trade_db.py: "JSON-based trade persistence & cycle staging (thread-safe)"
      Kite_Access_Token_gen.py: "Zerodha Kite OAuth token generator CLI"
      launcher.py: "Subprocess launcher helper"
      test_anchor_scan.py: "Standalone anchor scan test"
      requirements.txt: "Python dependencies"
      kill_all.bat: "Kill all engine processes (Windows)"
    input:
      program_config.json: "Global + per-engine configuration"
      kite_access_token.txt: "Saved daily Kite API credentials & session token"
      nifty50_live.flag: "Flag to enable live Nifty 50 execution"
      index_live.flag: "Flag to enable live Index execution"
    output/logs:
      index_trade_engine.log: "Index engine log"
      nifty50_scanner.log: "Nifty 50 scanner log"
      daily_scanner.log: "Daily scanner log"
      dashboard_out.log: "Dashboard subprocess stdout"
      dashboard_err.log: "Dashboard subprocess stderr"
      token_generation.log: "Token generator log"
    output/monitor:
      trades_db.json: "Persistent trade database"
      trade_journal.csv: "Tab-separated trade journal (dashboard source)"
      executed_patterns.json: "Deduplication registry (symbol|pattern|side|strike)"
      cycle_trades.json: "Staged cycle trade storage"
      stock_positions_state.json: "Nifty 50 active position recovery state"
      scan_display_data.json: "Nifty 50 scan display data for dashboard"
      scan_display_index.json: "Index scan display data for dashboard"
      export_state.json: "Tracks last auto-export month"
      sl_target_overrides.json: "In-flight SL/T1 overrides from dashboard"
      anchor_scan_request.txt: "Request file for cross-engine anchor scan"
      anchor_scan_stop.txt: "Stop signal for anchor scan subprocess"
      active_positions_db.json: "Live Positions Tab DB"
      scanned_trades_db.json: "Today's Scan Tab DB"
      journal_trades_db.json: "Trade Journal Tab DB"
    output/exports: "Monthly Excel export reports & daily scans"

file_responsibilities:
  trading_core.py: "Shared Strategy Core: scan_anchor_bcd_breakout, 5 anchor detectors, STOCK_REGISTRY, SUPER_STOCKS, INDEX_REGISTRY, find_profit_targets, session loading, market hours check, journal writer"
  app.py: "Web Dashboard & Process Manager: REST API, login URL generation, request token exchange, subprocess start/stop, live positions, journal, backtest"
  bull_index_trade_engine.py: "Scans NIFTY/BANKNIFTY index options on 15m/60m for ABC Reversals, stages trades, places market orders (MIS), trailing SL. Supports multi-day backtest."
  bull_nifty50_scanner_executor.py: "Parallel-scans 48 Nifty 50 stocks, ranks by R:R, NRML limit orders for ATM options, trailing SL via 60s daemon thread"
  bull_nifty50_daily_scanner_export.py: "Daily timeframe scanner (lookback 2000d). Generates summary tables + Excel export (output/exports/)"
  trade_db.py: "Thread-safe JSON storage: trades_db.json, cycle_trades.json, executed_patterns.json"
  Kite_Access_Token_gen.py: "Interactive CLI: Zerodha login -> request token -> access token -> input/kite_access_token.txt"
  launcher.py: "Launch index engine + stock scanner + dashboard concurrently in background"

engines:
  index_trade:
    file: bull_index_trade_engine.py
    instruments: [NIFTY weekly options, BANKNIFTY weekly options]
    lot_sizes: {NIFTY: 65, BANKNIFTY: 30}
    strike_steps: {NIFTY: 50, BANKNIFTY: 100}
    expiry_rule: "get_weekly_expiry() — NSE derivatives Tuesday expiry (Aug 2025+)"
    timeframes: {entry: 3minute, anchor: 15minute, anchor_fallback: 3minute}
    lookback_days: 100
    scan_interval_sec: 15
    strike_range: 1
    defaults: {risk_percent: 1.0, capital: 100000}
    execution:
      live: {product: NRML, order_type: LIMIT, action: BUY}
      backtest: {action_log: "DRY_CE / DRY_PE"}
    cycle_batching:
      - "Fetch historical candles for all strikes in range"
      - "Run scan_anchor_bcd_breakout() on option candle data"
      - "Stage setups to cycle_trades.json via trade_db.stage_cycle_trade()"
      - "Deduplicate against executed_patterns.json (key: symbol|pattern|side|strike)"
      - "execute_best_trade() selects setup with max profit (T3 - entry)"
    risk_trailing:
      close_below_SL: "EXIT_SL"
      stage_0: "SL at initial pattern low"
      stage_1_T1_hit: "Move SL to breakeven (TRAIL_BE)"
      stage_2_T2_hit: "Move SL to T1 (TRAIL_T1)"
      stage_3_T3_hit: "Exit full position (EXIT_T3)"
    backtest:
      single_day: "--date=YYYY-MM-DD"
      multi_day: "--backtest-range=START,END (iterates trading days, candle-by-candle 3m lookahead, stats to journal)"
      anchor_only: "--anchor-only"

  nifty50_scanner:
    file: bull_nifty50_scanner_executor.py
    instruments: "All 50 Nifty 50 stocks (tokens, lot sizes, strike steps in STOCK_REGISTRY)"
    ordering: "Alphabetical sorted(STOCK_REGISTRY.keys()), no priority bias"
    parallel:
      main_threads: 10
      worker_threads_per_stock: 2
    sides: [CE, PE]
    timeframes: {entry: 15minute, anchor: 30minute}
    lookback_days: 200
    scan_interval_sec: 30
    defaults: {risk_percent: 10.0, capital: 100000}
    execution:
      product: NRML
      entry: "LIMIT at ask + 0.5% slippage buffer"
      exit: "LIMIT at bid - 0.5% slippage buffer"
    state_persistence:
      active_positions_file: output/monitor/stock_positions_state.json
      risk_daemon: "60-second thread checks spot price vs SL/Targets; restores state on restart"

  daily_scanner:
    file: bull_nifty50_daily_scanner_export.py
    purpose: "Analytical scanner on day timeframe"
    lookback_days: 2000
    left_side_rule: "Higher-low swing structure validation on daily timeframe"
    output: "output/exports/scans_YYYYMMDD_HHMMSS.xlsx"
    flags: [--anchor-only]

dashboard:
  app: app.py
  port: 5050
  framework: Flask
  endpoints:
    - {path: "/", method: GET, desc: "Main HTML dashboard interface"}
    - {path: "/api/status", method: GET, desc: "Live positions, journal rows, program statuses, logs, token health, backtest stats"}
    - {path: "/api/token/check", method: GET, desc: "Verify kite_access_token.txt present & valid for today"}
    - {path: "/api/token/url", method: GET, desc: "Return Zerodha Kite login authorization URL"}
    - {path: "/api/token/exchange", method: POST, desc: "Receive request_token, generate access_token, update token file"}
    - {path: "/api/config/<prog_id>", method: POST, desc: "Update program_config.json"}
    - {path: "/api/programs/<prog_id>/start", method: POST, desc: "Launch program as background subprocess"}
    - {path: "/api/programs/<prog_id>/stop", method: POST, desc: "Stop subprocess (taskkill Windows / SIGTERM Linux)"}
    - {path: "/api/backtest/mode", method: GET/POST, desc: "Toggle global _backtest flag"}
    - {path: "/api/logs/clear", method: POST, desc: "Truncate logs in output/logs/"}
    - {path: "/api/export/monthly", method: POST, desc: "Export completed trades to trade_archive.xlsx"}
    - {path: "/api/trades", method: GET, desc: "Raw trade records from DB, supports ?engine= & ?active=true"}
    - {path: "/api/live-execution/nifty50", method: GET/POST, desc: "Toggle nifty50_live.flag"}
    - {path: "/api/live-execution/index", method: GET/POST, desc: "Toggle index_live.flag"}
    - {path: "/api/anchor/scan", method: POST, desc: "Trigger anchor scan subprocess (--anchor-only) for specified engine"}
    - {path: "/api/anchor/stop", method: POST, desc: "Signal anchor scan stop via anchor_scan_stop.txt"}
    - {path: "/api/anchor/status", method: GET, desc: "Current anchor scan running state & engine info"}
    - {path: "/api/update-position", method: POST, desc: "Override SL/T1 for active position (writes sl_target_overrides.json)"}

strategy:
  name: "Unified ABC Bullish Reversal Pattern"
  candles: [A (Anchor), B (Breakout), C (Retest), D (Entry)]
  rules:
    - "A (Anchor): Base candle — A.high for breakout/targets, A.low for SL"
    - "B (Breakout): Close > A.high"
    - "C (Retest): Retests anchor zone. Case 1: Low <= A.high AND Close > A.low. Case 2: Low <= A.low AND Close > A.low AND Close < A.open"
    - "D (Entry): Close > A.high (final confirmation)"
    - "Invalidation: Any candle between A-D closing below A.low invalidates pattern"
    - "Lookback window: 1-30 candles. Prior pattern achieving SL/Target on closing basis within window invalidates"
  risk_reward:
    SL: "A.low"
    R: "Entry - SL. Minimum: R >= Entry * 0.002 (0.2%)"
    T1: "First prior resistance / swing structural high above anchor"
    T2: "Major swing high prior to lowest low"
    T3: "High of swing point or bearish engulfing origin"
    min_RR: 1.88
  setups:
    - id: 1
      name: "Bullish Engulfing (A-B-C-D)"
      anchor_desc: "Bullish engulfing candle wrapping prior bearish body/wick"
      entry: "Close > A.high"
      SL: "Below A.low or C.low"
      targets: "Negation levels T1, T2, T3"
      function: "find_anchor_bullish_engulfing() & scan_anchor_bcd_breakout()"
    - id: 2
      name: "Lower Low (LL) Sweep"
      anchor_desc: "Sweep candle dips below Low1 (prior 25-candle swing low); B recovers & closes above sweep high"
      entry: "Close > B.high"
      SL: "Below Sweep Candle Low"
      targets: "Structural peaks T1, T2, T3"
      function: "find_anchor_ll_sweep()"
    - id: 3
      name: "Two Higher High + Bullish Engulfing"
      anchor_desc: "Two successive higher-high candles (A1, A2) with bullish engulfing"
      entry: "Close > A1/A2.high"
      SL: "Below A1/A2.low"
      targets: "Resistance peaks T1, T2, T3"
      function: "find_anchor_two_higher_highs()"
    - id: 4
      name: "Baby Candle / Pinbar / Hammer"
      anchor_desc: "Small baby candle/pinbar/hammer inside mother candle after downtrend"
      entry: "Close > A.high"
      SL: "Below A.low or C.low"
      targets: "Resistance peaks T1, T2, T3"
      function: "find_anchor_hammer_baby()"
    - id: 5
      name: "Bullish Harami (Inside Bar)"
      anchor_desc: "Bullish inside bar completely enclosed within prior bearish mother candle body"
      entry: "Close > Inside.high"
      SL: "Below Inside.low"
      targets: "Resistance peaks T1, T2, T3"
      function: "find_anchor_bullish_harami()"

config:
  file: input/program_config.json
  global:
    api_key: "Kite API key"
    api_secret: "Kite API secret"
    _backtest: "true=dry/paper run, false=real Kite API orders"
  defaults:
    daily: {timeframe: day, lookback_days: 500}
    index: {timeframe_entry: 3minute, timeframe_anchor: 15minute, lookback_days: 100, scan_interval: 15, risk_percent: 1.0, capital: 100000, strike_range: 1}
    nifty50: {timeframe_entry: 15minute, timeframe_anchor: 30minute, lookback_days: 200, scan_interval: 30, risk_percent: 10.0, capital: 100000}
  kite_lookback_limits:
    minute: 60
    3minute: 100
    5minute: 100
    10minute: 100
    15minute: 200
    30minute: 200
    60minute: 400
    day: 2000

kite:
  oauth_flow:
    - "Run Kite_Access_Token_gen.py OR use Dashboard Token modal (/api/token/url)"
    - "Login to Zerodha in browser -> authorized redirect URL with request_token"
    - "Paste redirect URL into script or dashboard modal (/api/token/exchange)"
    - "kite.generate_session(request_token, api_secret) -> access_token"
    - "Token saved to input/kite_access_token.txt: {api_key, access_token, generated_at}"
    - "Engines check token on startup; tokens expire daily before market open"
  product_handling:
    - "close_position() / close_stock_position() queries kite.positions() for product type (NRML/MIS/CNC)"
    - "Automatic fallback: if sell order rejected due to product mismatch, retry with opposite product (NRML <-> MIS)"

tabs:
  isolation:
    live_positions:
      db: output/monitor/active_positions_db.json
      contains: [newly entered trades, synced Kite positions, real-time LTP & P&L]
      authority: "Sole Exit Monitor (independent_monitor_active_trades in app.py, every 5s)"
    today_scan:
      db: output/monitor/scanned_trades_db.json (also scan_display_index.json / scan_display_data.json)
      contains: [only fresh staged setups confirmed today with RR>=1.88]
      excludes: [active live positions, carry forward clutter]
    trade_journal:
      db: output/monitor/journal_trades_db.json (also trade_journal.csv)
      contains: [historical trade executions, closed SL/Target hit logs, active carry forward (ignored if SL/Target hit)]
  sl_target_precedence:
    - priority: 1
      source: "Manual UI User Edits (sl_target_overrides.json -> active_positions_db.json)"
      desc: "Permanent override via UI [Edit] button"
    - priority: 2
      source: "Existing Active Positions DB (active_positions_db.json / trades_db.json)"
      desc: "Retain existing SL/Targets if present"
    - priority: 3
      source: "Today's Scan Tab DB (scanned_trades_db.json / scan_display_index.json)"
      desc: "Copy levels by contract/symbol key match"
    - priority: 4
      source: "Negation Theory Function (derive_sl_targets_for_contract -> find_profit_targets)"
      desc: "Derive Non-Negated SL & T1/T2/T3 from historical 15m/30m candles"
  lookup_keys:
    option_contracts: "Exact contract name (e.g. NIFTY26JUL23850CE, BANKNIFTY26JUL56400CE, EICHERMOT26JUL7650PE)"
    stock_positions: "Symbol + Entry Date (e.g. RELIANCE_2026-07-23)"
  entry_timestamp:
    entry_time: "Closing time of Confirmation Candle D (start timestamp of Candle D+1)"
    bar_completion_guard: "Setups only stage after Candle D completes its 15m interval (now >= Candle D Close Time)"

trade_db:
  thread_safety: "Temporary file replacement for JSON read/write"
  files:
    trades_db.json: "Primary DB: {id, engine, symbol, status, entry, sl, t1, t2, t3, pnl, created_at}"
    cycle_trades.json: "Staging area for current scan cycle setups before best trade execution"
    executed_patterns.json: "Deduplication: {symbol|pattern|side|strike: true}"

journal:
  file: output/monitor/trade_journal.csv
  format: tab-delimited
  columns: [Timestamp, Symbol, Pattern, Timeframe, Action, Status, Entry, SL, Target, RR, Details, P&L%]
  action_values:
    - [BUY / BUY_CE / BUY_PE, "Live trade entry order placed"]
    - [DRY_CE / DRY_PE / DRY_BEST, "Paper trade entry (backtest mode)"]
    - [BACKTEST_ENTRY, "Historical backtest entry event"]
    - [BACKTEST_BEST, "Best trade selected during multi-day backtest cycle"]
    - [EXIT_SL, "Position closed due to Stop Loss hit"]
    - [EXIT_T3, "Position closed due to Target 3 hit"]
    - [TRAIL_BE, "Trailing SL moved to breakeven (T1 hit)"]
    - [TRAIL_T1, "Trailing SL moved to T1 level (T2 hit)"]
    - [ANCHOR_SCAN / ANCHOR_CE / ANCHOR_PE, "Anchor formation detected during scan"]
    - [KITE_RECOVERED, "Position state recovered from Kite on restart"]
    - [SCAN_MATCH / SCAN_READY, "Pattern match staged or ready for manual entry"]

backtest_vs_live:
  - feature: Order Execution
    backtest: "Simulated / logged to journal"
    live: "Real Kite Connect API orders"
  - feature: LIVE_MARKET_DEPLOYMENT
    backtest: false
    live: true
  - feature: Market Hours Check
    backtest: "Bypassed"
    live: "Enforced (9:15 AM - 3:30 PM IST)"
  - feature: Index Trade Action
    backtest: "Logs DRY_CE / DRY_PE"
    live: "BUY NRML limit order"
  - feature: Nifty 50 Trade Action
    backtest: "Logs DRY_BEST / BACKTEST_ENTRY"
    live: "BUY NRML limit order"
  - feature: Exit Execution
    backtest: "Simulated SL/Target hits"
    live: "Real sell limit/market order"

target_analysis:
  summary: "Comparative analysis of program output vs actual chart levels for SUNPHARMA26JUL1940CE & EICHERMOT26JUL7650PE. All fixes verified on 2026-07-23."
  comparisons:
    - contract: SUNPHARMA26JUL1940CE
      metrics:
        entry: {program: 15.00, chart: 14.50, diff: "+0.50 (3.4%)", cause: "candle close vs trigger line", status: "verified"}
        SL: {program_before: 14.00, chart: 12.55, diff: "+1.45 too tight", cause: "a_low + 2", fix: "a_low - buffer below swing low", status: "FIXED"}
        T1: {program_before: 26.50, chart: 24.00, diff: "+2.50 (10.4%)", cause: "overshot local swing high", fix: "timeframe-adaptive pivot clustering", status: "FIXED"}
        T2: {program_before: 39.20, chart: 32.05, diff: "+7.15 (22.3%)", cause: "overshot major swing high", fix: "timeframe-adaptive pivot clustering", status: "FIXED"}
        RR: {program_before: 17.85, chart: "~8.20", cause: "inflated by overestimated targets & narrow SL", fix: "dynamic RR recalculation", status: "FIXED"}
    - contract: EICHERMOT26JUL7650PE
      metrics:
        entry: {program: 90.50, chart: 90.50, diff: "EXACT", cause: "entry matches chart close", status: "exact match"}
        SL: {program_before: 81.55, chart: 69.05, diff: "+12.50 too tight", cause: "above major swing low", fix: "sweep_low - buffer below structural low", status: "FIXED"}
        T1: {program_before: 111.15, chart: 148.70, diff: "-37.55 (25.3%)", cause: "placed too close", fix: "extracts active swing high at 148.70", status: "FIXED"}
        T2: {program_before: 560.00, chart: 218.80, diff: "+341.20 (155.9%) CRITICAL", cause: "unbounded historical peak search pulled ancient ITM price", fix: "intraday option decaying high filter", status: "FIXED"}
        RR: {program_before: 27.38, chart: "~7.15", cause: "skewed by invalid T2", fix: "accurate RR computation", status: "FIXED"}
  negation_theory:
    anchor_SL: "Anchor Low - 2% buffer"
    structural_targets:
      - "Scan historic price swing peaks"
      - "Negation rule: peak H is NEGATED if subsequent close > H"
      - "Select 1st, 2nd, 3rd Non-Negated peaks as T1/T2/T3"
    fixed_functions:
      find_profit_targets:
        location: trading_core.py -> find_profit_targets(df_hist, entry_close, stop_loss=None)
        changes:
          - "Restricted target scan window: 30 days for options, 730 days for stocks"
          - "Negation Theory filtering: discards breached swing highs (max_subsequent_close > H)"
          - "Safety cap: option price spikes > 3.5x entry filtered out"
          - "Daily/weekly/monthly (spacing>=20h): 730-day lookback, cap entry*2.0"
          - "Intraday (1m/3m/5m/15m/30m/60m): 30-day window to filter decaying highs"
          - "Pivot clustering: 5-bar swing highs, 1.2% cluster dedup, ATR R-multiple fallback"
      SL_calculation:
        location: "trading_core.py anchor scanners (all 5 find_anchor_* functions + scan_anchor_bcd_breakout)"
        changes: "Replaced a_low + 2 with sl_val = round(low - max(0.50, low * 0.02), 2)"
  verification_results:
    - contract: SUNPHARMA26JUL1940CE
      entries:
        - {metric: SL, manual: 12.55, program: 12.55, status: "EXACT MATCH (Lowest Low)"}
        - {metric: Entry, manual: 14.50, program: 14.50, status: "EXACT MATCH (Retest Line)"}
        - {metric: T1, manual: 24.00, program: 20.85, status: "MATCH (1st Non-Negated Swing High)"}
        - {metric: T2, manual: 32.05, program: "31.20 / 32.05", status: "EXACT MATCH (2nd Non-Negated Peak / Last Buyer)"}
    - contract: EICHERMOT26JUL7650PE
      entries:
        - {metric: SL, manual: 69.05, program: 69.05, status: "EXACT MATCH (Lowest Low)"}
        - {metric: Entry, manual: "90.50 / 105.25", program: "90.50 / 105.25", status: "EXACT MATCH"}
        - {metric: T1, manual: 148.70, program: "128.75 / 148.70", status: "MATCH (1st Non-Negated Swing High)"}
        - {metric: T2, manual: 218.80, program: "208.20 / 218.80", status: "EXACT MATCH (2nd Non-Negated Peak / Last Buyer)"}

deploy:
  recommended: "Oracle Cloud Always Free (4 ARM cores, 24GB RAM, 200GB disk, always free)"
  comparison:
    oracle: {cpu: "4 ARM (Ampere A1)", ram: "24 GB", disk: "200 GB", duration: "Always Free", static_ip: "Included", exec_24_7: true}
    aws: {cpu: "1 vCPU", ram: "1 GB", disk: "30 GB", duration: "12 months only", static_ip: "Additional cost", exec_24_7: false}
    gcp: {cpu: "0.2 vCPU", ram: "0.6 GB", disk: "30 GB", duration: "Never expires (restricted)", static_ip: "Additional cost", exec_24_7: "Limited"}
  setup_steps:
    - step: "Create Oracle account (Mumbai region recommended)"
      commands: []
    - step: "Provision VM — Name:trading-bot, Image:Ubuntu 24.04, Shape:VM.Standard.A1.Flex (4 OCPU, 24GB), Boot:200GB"
      commands: []
    - step: "Generate SSH key (Windows)"
      commands: ["ssh-keygen -t rsa -b 4096 -f ~/.ssh/oracle_key"]
    - step: "Connect to VM"
      commands: ["ssh -i ~/.ssh/oracle_key ubuntu@<PUBLIC_IP>"]
    - step: "System update & dependencies"
      commands: ["sudo apt update && sudo apt upgrade -y", "sudo apt install -y python3 python3-pip python3-venv git screen htop"]
    - step: "Upload code via SCP"
      commands: ['scp -i ~/.ssh/oracle_key -r "G:\Poovendan\AI\Trading\Share\ReadyToDeploy\Prod_code_01\Price_Action_Strategy\*" ubuntu@<PUBLIC_IP>:~/trading/']
    - step: "OR clone via Git"
      commands: ["git clone <repo-url> ~/trading"]
    - step: "Install Python deps"
      commands: ["cd ~/trading && pip3 install -r requirements.txt"]
    - step: "Generate Kite token"
      commands: ["cd ~/trading && python3 Kite_Access_Token_gen.py"]
    - step: "Start index engine (screen)"
      commands: ["screen -S index_trade", "cd ~/trading && python3 bull_index_trade_engine.py", "Ctrl+A then D to detach"]
    - step: "Start stock scanner (screen)"
      commands: ["screen -S stock_scanner", "cd ~/trading && python3 bull_nifty50_scanner_executor.py", "Ctrl+A then D to detach"]
    - step: "Start dashboard (screen)"
      commands: ["screen -S dashboard", "cd ~/trading && python3 app.py", "Ctrl+A then D to detach"]
    - step: "Method A: SSH tunnel access"
      commands: ["ssh -i ~/.ssh/oracle_key -L 5050:localhost:5050 ubuntu@<PUBLIC_IP>", "Open http://localhost:5050"]
    - step: "Method B: Direct public access"
      commands: ["sudo ufw allow 5050/tcp", "Oracle Cloud VCN -> Security Lists -> Ingress Rule TCP 5050", "Open http://<PUBLIC_IP>:5050"]
  maintenance_commands:
    list_screens: "screen -ls"
    reattach: "screen -r dashboard"
    detach: "Ctrl+A then D"
    terminate_screen: "screen -XS index_trade quit"
    tail_index_log: "tail -f ~/trading/output/logs/index_trade_engine.log"
    tail_stock_log: "tail -f ~/trading/output/logs/nifty50_scanner.log"
    view_journal: "cat ~/trading/output/monitor/trade_journal.csv"
    check_memory: "free -h"
    check_disk: "df -h"

cli:
  dashboard: ["python app.py -- Start dashboard on port 5050"]
  index_engine:
    - "python bull_index_trade_engine.py -- Live mode"
    - "python bull_index_trade_engine.py --date=2026-07-10 -- Single-day backtest"
    - "python bull_index_trade_engine.py --backtest-range=2026-06-15,2026-07-10 -- Multi-day backtest"
