      Added interactive green BUY button to Scan Tab table in app_option_Trade.py (Port 5050) and app_Sock_Trade.py (Port 5051), backed by /api/buy-scanned-trade API endpoint with dynamic exchange resolution and automatic BOUGHT status protection against double-buying.
