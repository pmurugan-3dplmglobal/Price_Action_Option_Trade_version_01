  - id: FEATURE-010
    title: Dual Monitoring Split (09:15 AM Target Exit vs 09:45 AM SL Failsafe)
    severity: ENHANCEMENT
    category: Risk Management & Strategy Execution
    date_reported: "2026-08-01"
    symptom: |
      Single monitoring loop evaluated both SL and Target simultaneously during volatile 09:15-09:45 AM opening window, risking premature SL shakeouts.
    root_cause: |
      Need to separate Target monitoring (active from 09:15 AM open) from SL monitoring (deferred to 09:45 AM+ with 3-way confirmation).
    affected_files:
      - common/trading_core.py
    resolution: |
      Updated monitor_active_positions in common/trading_core.py: Target monitoring remains active from 09:15 AM. SL monitoring skips 09:15-09:45 AM window, evaluates a 3-way failsafe check at 09:45 AM (LTP < SL & prev candle closed < SL & current candle trading < SL), then resumes continuous SL monitoring after 09:45 AM.
    status: RESOLVED

  - id: FEATURE-011
    title: Non-Intrusive Scan Export Spot Trend & Target Annotator Utility
    severity: ENHANCEMENT
    category: Data Export & Analysis
    date_reported: "2026-08-01"
    symptom: |
      Scan exports lacked underlying spot stock trend and spot T1 target metrics.
    root_cause: |
      Need a separate, non-intrusive post-processing utility to enrich scan export CSV files without modifying core engines.
    affected_files:
      - common/spot_enricher.py
    resolution: |
      Created common/spot_enricher.py utility module. It reads exported scan CSVs, extracts underlying symbols, evaluates spot trend (BULL/BEAR) and spot T1 target using Negation Theory, and appends Spot_Trend and Spot_T1_Target columns to an enriched CSV output file.
    status: RESOLVED

  - id: FEATURE-012
    title: Strict Anchor A.low Closing Basis Invalidation Alignment (Option A)
    severity: ENHANCEMENT
    category: Pattern Engine & Blueprint Alignment
    date_reported: "2026-08-04"
    symptom: |
      Breakout scanner previously checked invalidation against A.low - buffer (e.g. 60.43), allowing candles after C to close below A.low (e.g. 61.50) while remaining above the buffered SL level.
    root_cause: |
      Discrepancy with Master Price Action Blueprint (Page 6), which explicitly mandates "holding above A.low" (A.low floor line) on a closing basis.
    affected_files:
      - common/trading_core.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      Updated scan_anchor_bcd_breakout in common/trading_core.py to strictly enforce Option A invalidation: setup is invalidated if any candle between A and D closes below A.low (a_low floor line), while retaining A.low - buffer (sl_val) for order execution risk-reward and Stop Loss calculations.
    status: RESOLVED

  - id: ISSUE-003
    title: Display Data Write Failed - NameError 'rr' Is Not Defined
    severity: HIGH
    category: Persistence & UI Serialization
    date_reported: "2026-08-04"
    symptom: |
      Display data write failed with error: name 'rr' is not defined when index/stock options engine called write_scan_display_data.
    root_cause: |
      Inside build_trade helper function in common/trading_core.py, the output dictionary attempted to reference an outer scope variable 'rr' instead of computing or reading trade risk-reward.
    affected_files:
      - common/trading_core.py
      - ISSUE_MANAGEMENT.yaml
    resolution: |
      Updated build_trade in write_scan_display_data to safely extract rr_val from trade dictionary (or dynamically calculate risk-reward from entry, sl, and t1) and format rr_num safely.
    status: RESOLVED




